[platformio]
default_envs = esp32c3

; One firmware, one env per board template: `pio run -e ti-clicker -t upload`.
; Pins and name here are only first-boot defaults; the app changes them without reflashing.
; ESP32-S2 is not listed: it has no Bluetooth, so it cannot be a BLE keyboard.
[env]
framework = arduino
platform = espressif32
monitor_speed = 115200
lib_deps =
    https://github.com/5mustafa/ESP32-BLE-Keyboard.git#9496d5954369ab72d45ee9d70a99ce3187021e39
native_usb_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; 4-button macropad, ESP32-C3, GPIO 3/4/5/6.
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.native_usb_flags}
    -D MACROPAD_BOARD='"macropad4"'

; ESP32-C3 Super Mini page turner, GPIO 7/8/9 (GPIO9 is also the BOOT button).
[env:ti-clicker]
board = esp32-c3-devkitm-1
build_flags =
    ${env.native_usb_flags}
    -D MACROPAD_PINS=7,8,9
    '-D MACROPAD_NAME="Ti Clicker"'
    -D MACROPAD_BOARD='"ti-clicker"'

; ESP32-S3 DevKitC, native USB port, GPIO 4/5/6/7.
[env:esp32s3]
board = esp32-s3-devkitc-1
; 4 MB layout so the image also fits S3 modules with the smallest common flash.
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    ${env.native_usb_flags}
    -D MACROPAD_PINS=4,5,6,7
    -D MACROPAD_BOARD='"esp32s3-4key"'

; Classic ESP32 DevKit (USB-UART bridge such as CP2102/CH340), GPIO 25/26/27/32.
[env:esp32]
board = esp32dev
build_flags =
    -D MACROPAD_PINS=25,26,27,32
    -D MACROPAD_BOARD='"esp32-4key"'

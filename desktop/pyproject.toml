[project]
name = "macropad-configurator"
version = "0.11.0"
description = "USB/BLE companion, macro configurator and firmware flasher for ESP32 boards"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "pyserial==3.5",
    "pynput>=1.7.7,<2",
    "bleak==3.0.2",
    "esptool==4.8.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "pyinstaller>=6,<7", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

